name: Build ARBNT new2 JSON install ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/package-arbnt-new2.sh"
      - ".github/workflows/package-new2.yml"
      - "docs/ARBNT_NEW2_INSTALL.md"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONE Engine build script
        uses: actions/checkout@v4
      - name: Checkout audited ARBNT source snapshot
        uses: actions/checkout@v4
        with:
          repository: abud3d/arbnt
          ref: 1b5c44b21bc328fef7bc4645ce3140dba0ed13d1
          path: _arbnt_original
          persist-credentials: false
      - name: Build standalone new2 JSON installer
        run: |
          bash scripts/package-arbnt-new2.sh _arbnt_original dist
      - name: Verify archive has private data isolation and standalone installer
        run: |
          set -eu
          test -s dist/arbnt-new2-json.zip
          test -s dist/arbnt-new2-json.zip.sha256
          unzip -Z1 dist/arbnt-new2-json.zip | grep -q '^install.php$'
          unzip -Z1 dist/arbnt-new2-json.zip | grep -q '^api/community.php$'
          unzip -Z1 dist/arbnt-new2-json.zip | grep -q '^\.htaccess$'
          ! unzip -Z1 dist/arbnt-new2-json.zip | grep -E -q '^arbnt-private/|^storage/|\.env$|users.json$'
          grep -q 'arbnt-new2-private' dist/new2/install.php
          grep -q 'arbnt-new2-private' dist/new2/app/core.php
          grep -q 'arbnt-new2-app' dist/new2/install.php
          grep -q "\.arbnt-app\.php" dist/new2/install.php
          sha256sum --check dist/arbnt-new2-json.zip.sha256
          echo "Packaged files:"
          unzip -Z1 dist/arbnt-new2-json.zip | tail -10
      - name: Upload ready-to-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: arbnt-new2-json-install
          path: |
            dist/arbnt-new2-json.zip
            dist/arbnt-new2-json.zip.sha256
          retention-days: 30
          if-no-files-found: error
