name: ONE Engine foundation

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, zip
          coverage: none
          tools: none
      - name: PHP syntax
        run: |
          find src config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bootstrap.php
          php -l bin/one
          php -l bin/one-arbnt-install
          php -l bin/one-arbnt-password
          php -l bin/one-posts
          php -l bin/one-pages
          php -l bin/one-admin
          php -l bin/one-demo-package
          php -l bin/one-install\n          php -l bin/one-doctor
          php -l bin/one-cms-package
      - name: Behavioral, concurrency and HTTP tests
        run: php tests/run.php
      - name: Check module boundaries and release hygiene
        run: python3 tests/check_structure.py
      - name: Build all foundation modes
        run: |
          mkdir build
          php bin/one build static build/static
          php bin/one build hybrid build/hybrid
          php bin/one build dynamic build/dynamic
      - name: Build separate static site ZIP
        run: php bin/one-demo-package build/cms-demo build/one-engine-cms-demo.zip
      - name: Build and accept interactive CMS ZIP
        run: |
          php bin/one-cms-package build/cms-runtime build/one-engine-cms-runtime.zip
          php tests/cms_package_acceptance.php build/one-engine-cms-runtime.zip build/cms-acceptance
      - name: Accept CMS ZIP on Apache PHP 8.3
        if: matrix.php == '8.3'
        run: bash scripts/test-cms-apache.sh build/one-engine-cms-runtime.zip build/apache-acceptance
      - name: Upload static site ZIP
        uses: actions/upload-artifact@v4
        with:
          name: one-engine-static-site-php-${{ matrix.php }}
          path: build/one-engine-cms-demo.zip
          if-no-files-found: error
      - name: Upload interactive CMS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: one-engine-cms-runtime-php-${{ matrix.php }}
          path: build/one-engine-cms-runtime.zip
          if-no-files-found: error
